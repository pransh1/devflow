# CI workflow (runs on every push)

name: CI

on:
  push:
    branches: ['**']        # every branch
  pull_request:
    branches: [main]        # PRs targeting main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      # Spin up a real Postgres for integration tests
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devflow
          POSTGRES_PASSWORD: devflow_password
          POSTGRES_DB: devflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Spin up Redis for cache tests
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://devflow:devflow_password@localhost:5432/devflow
      DATABASE_URL_TEST: postgresql://devflow:devflow_password@localhost:5432/devflow_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test_access_secret_for_ci
      JWT_REFRESH_SECRET: test_refresh_secret_for_ci
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      SMTP_HOST: smtp.ethereal.email
      SMTP_PORT: 587
      SMTP_USER: test@ethereal.email
      SMTP_PASS: testpass
      EMAIL_FROM: DevFlow <noreply@devflow.com>
      NODE_API_INTERNAL_SECRET: test_internal_secret_for_ci
      AI_SERVICE_URL: http://localhost:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'         # cache node_modules between runs

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --reporter=verbose --reporter=github-actions

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()           # upload even if tests fail
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

