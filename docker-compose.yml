services:
  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow_password
      POSTGRES_DB: devflow
    volumes:
      - postgres_data:/var/lib/postgresql/data  # persist data between restarts
    ports:
      - "5433:5432"  # 5433 on host to avoid conflict with local postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: devflow_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"  # 6380 on host to avoid conflict with local redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: devflow_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://devflow:devflow_password@postgres:5432/devflow
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      postgres:
        condition: service_healthy  # wait for postgres to be ready
      redis:
        condition: service_healthy  # wait for redis to be ready
    volumes:
      - ./src/db/migrations:/app/src/db/migrations  # mount migrations


  # ── AI services ──────────────────────────────────────────────────
  ai-service:
      build:
        context: ./ai-service
        dockerfile: Dockerfile
      container_name: devflow_ai
      restart: unless-stopped
      ports:
        - "8000:8000"
      environment:
        DATABASE_URL: postgresql://devflow:devflow_password@postgres:5432/devflow
        OPENAI_API_KEY: ${OPENAI_API_KEY}
        ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
        NODE_API_URL: http://api:5000
        NODE_API_INTERNAL_SECRET: ${NODE_API_INTERNAL_SECRET}
        EMBEDDING_MODEL: text-embedding-3-small
        EMBEDDING_DIMENSIONS: "1536"
      depends_on:
        postgres:
          condition: service_healthy



# ── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data: